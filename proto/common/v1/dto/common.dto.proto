syntax = "proto3";

package common.v1.dto;

option go_package = "github.com/dangngochoainam/gm-core/application/common/v1/dto;commondtov1";

// SystemCode is the system-wide business code the gateway publishes as
// "systemCode". A value's name is the ErrorInfo.reason a service sends; its
// number is the code. The first three digits are the HTTP status group, the last
// two a sequence: 00 is the group's generic code, 90-99 are raised by the
// gateway itself.
enum SystemCode {
  SYSTEM_CODE_UNSPECIFIED = 0;
  SUCCESS = 1;

  BAD_REQUEST = 40000;
  VALIDATION_FAILED = 40001;
  UNAUTHORIZED = 40100;
  FORBIDDEN = 40300;
  NOT_FOUND = 40400;
  USER_NOT_FOUND = 40401;
  SESSION_NOT_FOUND = 40402;
  CONFLICT = 40900;
  EMAIL_EXISTED = 40901;
  AUTH_ACCOUNT_EXISTED = 40902;
  TOO_MANY_REQUESTS = 42900;
  CANCELED = 49900;
  INTERNAL_SERVER_ERROR = 50000;
  METHOD_NOT_ALLOWED = 50100;
  DEADLINE_EXCEEDED = 50400;

  ROUTE_NOT_FOUND = 40490;
  ROUTE_METHOD_NOT_ALLOWED = 40590;
  REQUEST_TOO_LARGE = 41390;
  GATEWAY_INTERNAL_ERROR = 50090;
}
